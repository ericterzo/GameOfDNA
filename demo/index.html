<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Robot Walk — Spaceship Demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .ui { position: fixed; left: 0; right: 0; pointer-events: none; font: 500 14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color: #cfe3ff; }
  .top { top: max(14px, env(safe-area-inset-top)); padding: 0 18px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { text-shadow: 0 2px 10px #000; }
  .title h1 { margin: 0; font-size: 17px; letter-spacing: .5px; font-weight: 700; color: #eaf2ff; }
  .title p  { margin: 3px 0 0; font-size: 12.5px; color: #8fb0d8; }
  .btn { pointer-events: auto; text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
         background: rgba(20,32,54,.72); border: 1px solid #2d466a;
         color: #dcebff; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
         backdrop-filter: blur(8px); transition: background .15s, transform .15s; }
  .btn:hover { background: rgba(32,52,86,.9); transform: translateY(-1px); }
  .btn svg { width: 15px; height: 15px; }
  .hint { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
          font-size: 12px; color: #6f8cb3; text-shadow: 0 1px 6px #000; }
  #load { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center;
          background: #05060a; z-index: 10; transition: opacity .6s; color: #9fc0ea; }
  #load.hide { opacity: 0; pointer-events: none; }
  .ring { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #1d2c44; border-top-color: #5aa0ff; animation: spin 1s linear infinite; }
  #bar { width: 180px; height: 4px; border-radius: 3px; background: #15223a; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#4a86ff,#73e0ff); transition: width .2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div class="ring"></div><div id="bar"><i></i></div><div id="lt">Loading robot…</div></div>
<div class="ui top">
  <div class="title"><h1>Robot · Rigged Walk Cycle</h1><p>Skeletal rig + walk animation · inside a spaceship</p></div>
  <a class="btn" id="dl" href="robot.vrm" download="robot.vrm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
    Download VRM
  </a>
</div>
<div class="hint">Drag to orbit · scroll to zoom · the camera drifts on its own until you touch it</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 16, 46);

// image-based environment so the metal robot & hull reflect light (metals need this)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(4.2, 2.3, 6.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.0, 0);

// ---------- Spaceship corridor ----------
const W = 3.4, H = 2.9, L = 30;        // width, height, length
const ship = new THREE.Group();
scene.add(ship);

const matHull = new THREE.MeshStandardMaterial({ color: 0x3a4152, metalness: 0.85, roughness: 0.55, envMapIntensity: 0.35 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x1b2130, metalness: 0.9, roughness: 0.5, envMapIntensity: 0.3 });
const matPanel= new THREE.MeshStandardMaterial({ color: 0x4a5268, metalness: 0.8, roughness: 0.45, envMapIntensity: 0.4 });
const matFloor= new THREE.MeshStandardMaterial({ color: 0x232a38, metalness: 0.75, roughness: 0.5, envMapIntensity: 0.35 });

// floor
const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, L), matFloor);
floor.position.y = -0.1; floor.receiveShadow = true; ship.add(floor);
// floor seam strips (emissive) + walkway grid
const seamMat = new THREE.MeshStandardMaterial({ color: 0x0a0e16, metalness: 0.6, roughness: 0.6 });
for (let i = -2; i <= 2; i++) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.205, L), seamMat);
  s.position.set(i * (W/5), 0.001, 0); ship.add(s);
}
for (let z = -L/2; z <= L/2; z += 1.5) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(W, 0.205, 0.05), seamMat);
  s.position.set(0, 0.001, z); ship.add(s);
}
// ceiling
const ceil = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, L), matHull);
ceil.position.y = H; ceil.receiveShadow = true; ship.add(ceil);

// side walls
for (const sx of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.2, H, L), matHull);
  wall.position.set(sx * W/2, H/2, 0); wall.receiveShadow = true; ship.add(wall);
  // wall panels
  for (let z = -L/2 + 1; z < L/2; z += 2) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, H * 0.6, 1.5), matPanel);
    p.position.set(sx * (W/2 - 0.12), H * 0.52, z); ship.add(p);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 1.2),
      new THREE.MeshStandardMaterial({ color: 0x1a90ff, emissive: 0x1a70ff, emissiveIntensity: 1.4, roughness: 0.4 }));
    stripe.position.set(sx * (W/2 - 0.16), H * 0.26, z); ship.add(stripe);
  }
}

// structural ribs / arches for depth
const ribMat = matDark;
for (let z = -L/2 + 2; z < L/2; z += 4) {
  const top = new THREE.Mesh(new THREE.BoxGeometry(W + 0.1, 0.34, 0.4), ribMat);
  top.position.set(0, H - 0.1, z); top.castShadow = true; ship.add(top);
  for (const sx of [-1, 1]) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.32, H, 0.4), ribMat);
    col.position.set(sx * (W/2 - 0.1), H/2, z); col.castShadow = true; ship.add(col);
  }
}

// ceiling light strips (emissive bars) + the lights they imply
const stripGeo = new THREE.BoxGeometry(0.4, 0.06, 1.6);
const stripMat = new THREE.MeshStandardMaterial({ color: 0xbfe0ff, emissive: 0xafe0ff, emissiveIntensity: 2.2, roughness: 0.3 });
const corridorLights = [];
for (let z = -L/2 + 2; z < L/2; z += 4) {
  const bar = new THREE.Mesh(stripGeo, stripMat);
  bar.position.set(0, H - 0.22, z); ship.add(bar);
  const pl = new THREE.PointLight(0xbfe0ff, 7.0, 11, 2.0);
  pl.position.set(0, H - 0.5, z); ship.add(pl);
  corridorLights.push(pl);
}

// end viewport to space (both ends) with a starfield
function endWall(zSign) {
  const z = zSign * L/2;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.2), matHull);
  frame.position.set(0, H/2, z); ship.add(frame);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.62, H * 0.5),
    new THREE.MeshStandardMaterial({ color: 0x0a1226, emissive: 0x0a1836, emissiveIntensity: 0.6, metalness: 0.1, roughness: 0.1 }));
  glass.position.set(0, H * 0.55, z - zSign * 0.11); glass.rotation.y = zSign < 0 ? 0 : Math.PI; ship.add(glass);
}
endWall(-1); endWall(1);

// starfield outside
const starGeo = new THREE.BufferGeometry();
const starN = 1200, sp = new Float32Array(starN * 3);
for (let i = 0; i < starN; i++) {
  sp[i*3] = (Math.random()-0.5) * 60;
  sp[i*3+1] = (Math.random()-0.2) * 30;
  sp[i*3+2] = (Math.random() < 0.5 ? -1 : 1) * (L/2 + 2 + Math.random()*25);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbcd4ff, size: 0.12, sizeAttenuation: true })));

// a few crates for scale/detail
const crateMat = new THREE.MeshStandardMaterial({ color: 0x5a4a32, metalness: 0.4, roughness: 0.7 });
function crate(x, z, s) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), crateMat);
  m.position.set(x, s/2, z); m.castShadow = true; m.receiveShadow = true; m.rotation.y = Math.random()*0.5; ship.add(m);
}
crate(-W/2 + 0.6, -L/2 + 4, 0.7); crate(-W/2 + 0.55, -L/2 + 4.8, 0.5);
crate(W/2 - 0.6, L/2 - 5, 0.8); crate(W/2 - 0.7, 4, 0.6);

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0x8098c0, 0x202430, 0.5));
const key = new THREE.DirectionalLight(0xdfe8ff, 1.4);
key.position.set(3, 7, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 18;
key.shadow.camera.left = -3.5; key.shadow.camera.right = 3.5;
key.shadow.camera.top = 4.5; key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
scene.add(key);
scene.add(key.target);   // light + its shadow frustum will follow the robot
const rim = new THREE.DirectionalLight(0x3a6cff, 0.8);
rim.position.set(-4, 3, -5); scene.add(rim);

// ---------- Robot ----------
const robot = new THREE.Group();
scene.add(robot);
const SCALE = 1.95;
let mixer = null, walkAction = null;
const clock = new THREE.Clock();

const loadEl = document.getElementById('load');
const barEl = document.querySelector('#bar i');
const ltEl = document.getElementById('lt');

new GLTFLoader().load('robot.vrm', (gltf) => {
  const model = gltf.scene;
  model.scale.setScalar(SCALE);
  model.position.y = 0.5 * SCALE;          // feet (model y=-0.5) onto the floor
  model.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.frustumCulled = false;
      if (o.material) { o.material.metalness = Math.min(o.material.metalness ?? 1, 0.82); o.material.envMapIntensity = 1.15; o.material.needsUpdate = true; } }
  });
  robot.add(model);
  mixer = new THREE.AnimationMixer(model);
  const clip = THREE.AnimationClip.findByName(gltf.animations, 'Walk') || gltf.animations[0];
  walkAction = mixer.clipAction(clip);
  walkAction.setLoop(THREE.LoopRepeat);
  walkAction.play();
  loadEl.classList.add('hide');
  window.__ready = true;
}, (ev) => {
  if (ev.total) { const p = ev.loaded / ev.total; barEl.style.width = (p*100).toFixed(0) + '%';
    ltEl.textContent = 'Loading robot… ' + (p*100).toFixed(0) + '%'; }
}, (err) => { ltEl.textContent = 'Failed to load model'; console.error(err); });

// ---------- Robot pacing along the corridor ----------
const SPEED = 1.15 * SCALE;               // forward m/s, tuned to the stride
const endZ = L/2 - 2.4;
let dir = 1, turning = 0, heading = 0;    // dir: travel sense; heading: yaw (rad)
robot.position.set(0, 0, -endZ);

function updateRobot(dt) {
  if (turning > 0) {                      // ~0.6 s about-face at each end
    turning -= dt;
    heading += (dir > 0 ? 1 : -1) * Math.PI * dt / 0.6;
    if (turning <= 0) heading = dir > 0 ? 0 : Math.PI;
  } else {
    robot.position.z += dir * SPEED * dt;
    if (dir > 0 && robot.position.z >= endZ) { dir = -1; turning = 0.6; }
    else if (dir < 0 && robot.position.z <= -endZ) { dir = 1; turning = 0.6; }
  }
  robot.rotation.y = heading;
}

// ---------- Auto chase-cam (stays inside the hull) until the user grabs ----------
let userActive = false;
controls.addEventListener('start', () => { userActive = true; });
const INT = { x: W/2 - 0.35, z: L/2 - 0.8, ymin: 0.8, ymax: H - 0.3 };
let camPhase = 0;
const _des = new THREE.Vector3(), _look = new THREE.Vector3();
camera.position.set(robot.position.x, 1.5, robot.position.z - 3.4 * dir);
function autoCam(dt) {
  camPhase += dt;
  _des.set(
    robot.position.x + Math.sin(camPhase * 0.5) * 1.1,
    1.5 + Math.sin(camPhase * 0.33) * 0.22,
    robot.position.z - 3.4 * dir + Math.cos(camPhase * 0.4) * 0.6
  );
  _des.x = THREE.MathUtils.clamp(_des.x, -INT.x, INT.x);
  _des.z = THREE.MathUtils.clamp(_des.z, -INT.z, INT.z);
  _des.y = THREE.MathUtils.clamp(_des.y, INT.ymin, INT.ymax);
  camera.position.lerp(_des, 1 - Math.pow(0.0015, dt));
  _look.set(robot.position.x, 1.05, robot.position.z + dir * 0.8);
  controls.target.lerp(_look, 1 - Math.pow(0.0005, dt));
  camera.lookAt(controls.target);
}

// ---------- Resize / loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  updateRobot(dt);
  key.position.set(robot.position.x + 2.5, 7, robot.position.z + 3);
  key.target.position.set(robot.position.x, 0.9, robot.position.z);
  key.target.updateMatrixWorld();
  if (userActive) controls.update(); else autoCam(dt);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
